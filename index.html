<style>
:root {
  color-scheme: light;
  --bg: #e2f1ee;
  --surface: #f7fbfa;
  --ink: #1e3a3a;
  --muted: #5d7d7b;
  --line: #cde3e0;
  --accent: #2b8f89;
  --accent-soft: #d9eeeb;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  position: relative;
  overflow-x: hidden;
}
.bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg svg {
  position: absolute;
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.16;
}
main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border-radius: 20px;
  padding: 32px 22px 22px;
  box-shadow: 0 10px 40px rgba(43, 143, 137, 0.10);
}
h1 { font-size: clamp(1.45rem, 6.5vw, 1.8rem); font-weight: 600; line-height: 1.25; margin-bottom: 26px; }
ul { list-style: none; padding: 0; }
li + li { margin-top: 10px; }
.row {
  width: 100%;
  min-height: 68px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition: background-color 0.2s, border-color 0.2s;
}
.row:active { background: var(--accent-soft); border-color: var(--accent); }
@media (hover: hover) {
  .row:hover { background: var(--accent-soft); border-color: var(--accent); }
}
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.icon svg, .end svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.text { flex: 1; min-width: 0; }
.label { display: block; color: var(--muted); font-size: 0.85rem; }
.value { display: block; font-weight: 500; font-size: clamp(0.84rem, 3.8vw, 1.02rem); overflow-wrap: anywhere; }
.end { flex: none; color: var(--muted); display: grid; place-items: center; }
.end svg { width: 18px; height: 18px; }
.row.done { background: var(--accent-soft); border-color: var(--accent); }
.row.done .end { color: var(--accent); }
@media (max-width: 400px) {
  main { padding: 28px 16px 16px; }
  .row { gap: 12px; padding: 12px; }
  .icon { width: 36px; height: 36px; }
  .end { display: none; }
  .bg svg { transform-origin: center; scale: 0.8; }
}
@media (prefers-reduced-motion: reduce) { .row { transition: none; } }
</style>
</head>

<script>
(function () {
  var checkIcon = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    ta.style.fontSize = '16px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.row[data-copy]'), function (btn) {
    var label = btn.querySelector('.label');
    var end = btn.querySelector('.end');
    var original = label.getAttribute('data-label');
    var copyIcon = end.innerHTML;
    var timer;

    function showDone() {
      btn.classList.add('done');
      label.textContent = 'Copied';
      end.innerHTML = checkIcon;
      clearTimeout(timer);
      timer = setTimeout(function () {
        btn.classList.remove('done');
        label.textContent = original;
        end.innerHTML = copyIcon;
      }, 1800);
    }

    btn.addEventListener('click', function () {
      var text = btn.getAttribute('data-copy');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showDone, function () { fallbackCopy(text); showDone(); });
      } else {
        fallbackCopy(text);
        showDone();
      }
    });
  });
})();
</script>
